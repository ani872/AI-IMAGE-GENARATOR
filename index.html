<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator</title>
    <!-- Use a reliable Font Awesome version -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <div class="container">
        <header class="header">
            <div class="logo-wrapper">
                <div class="logo">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>   
                </div>
                <h1 class="title">AI Image Generator</h1>
            </div>
         
            <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle Theme">
                <i class="fa-solid fa-moon"></i>
            </button>
        </header>

        <div class="main-content">
            <form action="#" class="prompt-form" id="generate-form">
                <div class="prompt-container">
                    <textarea class="prompt-input" id="prompt-input" placeholder="Describe your imagination in detail..." required autofocus></textarea>
                    <button type="button" class="prompt-magic-btn" aria-label="Enhance Prompt">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </button>
                </div>
                
                <div class="prompt-actions">
                    <div class="select-wrapper">
                        <select class="custom-select" name="model" id="model-select" required>
                            <option value="" selected disabled>Select Model</option>
                            <option value="black-forest-labs/FLUX.1-dev">FLUX.1-dev</option>
                            <option value="black-forest-labs/FLUX.1-schnell">FLUX.1-schnell</option>
                            <option value="stabilityai/stable-diffusion-xl-base-1.0">Stable Diffusion XL Base 1.0</option>
                            <option value="runwayml/stable-diffusion-v1.5">Stable Diffusion v1.5</option>
                            <option value="prompthero/openjourney">OpenJourney</option>
                        </select>
                    </div>

                    <div class="select-wrapper">
                        <select class="custom-select" name="imageCount" id="count-select" required>
                            <option value="" disabled>Image Count</option>
                            <option value="1">1 Image</option>
                            <option value="2" selected>2 Images</option>
                            <option value="3">3 Images</option>
                            <option value="4">4 Images</option>
                        </select>
                    </div>

                    <div class="select-wrapper">
                        <select class="custom-select" name="aspectRatio" id="ratio-select" required>
                            <option value="" selected disabled>Aspect Ratio</option>
                            <option value="1/1">Square (1:1)</option>
                            <option value="16/9">Landscape (16:9)</option>
                            <option value="9/16">Portrait (9:16)</option>
                        </select>
                    </div>
                     
                    <button type="submit" class="generate-btn" id="generate-btn">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        <span>Generate</span>
                    </button>
                </div>
            </form>
            
            <!-- This section is ready for JS to inject the generated images -->
            <div class="gallery-grid">
            </div>
        </div>
    </div>
     <script src="script.js"></script>
</body>
</html>
